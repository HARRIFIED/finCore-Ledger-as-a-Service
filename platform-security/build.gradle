// Plain library (no Spring Boot plugin / no bootJar). Shared code every downstream
// service uses to consume the API Gateway's injected identity headers.

dependencies {
    // Web types (HandlerMethodArgumentResolver, WebMvcConfigurer, NativeWebRequest).
    // implementation, not api — the consuming service already brings spring-boot-starter-web.
    implementation 'org.springframework:spring-webmvc'

    // @AutoConfiguration + @ConditionalOnWebApplication so the resolver registers itself
    // when a service adds this module (no per-service wiring).
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
}
