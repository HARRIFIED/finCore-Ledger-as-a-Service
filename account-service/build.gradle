plugins {
    id 'org.springframework.boot'
    id 'java'
}

apply plugin: 'io.spring.dependency-management'

bootRun {
    // Load shared infra defaults from the root .env, then this module's own .env
    // (service-specific values win). Both are git-ignored; see the .env.example files.
    [rootProject.file('.env'), project.file('.env')].each { envFile ->
        if (envFile.exists()) {
            def props = new Properties()
            envFile.withInputStream { props.load(it) }
            environment props
        }
    }
}

dependencies {
    // Shared platform modules: gateway identity, tenancy seam, transactional outbox.
    implementation project(':platform-security')
    implementation project(':platform-tenancy')
    implementation project(':platform-outbox')

    // Internal gRPC surface (ADR-0010) — proto contracts + gRPC client (net.devh, below).
    implementation project(':api-contracts')

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'org.postgresql:postgresql'
    // Boot 4 modularized auto-config: the Flyway starter (not bare flyway-core) is
    // required for migrations to run automatically at startup.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.6.2'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'

}
