/*
 * This file was generated by the Gradle 'init' task.
 *
 * The settings file is used to specify which projects to include in your build.
 * For more detailed information on multi-project builds, please refer to https://docs.gradle.org/9.5.1/userguide/multi_project_builds.html in the Gradle documentation.
 */

plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'finCore'

// Include each module only if its directory is present. A full checkout has all of them;
// inside a single service's Docker build only that service plus its module dependencies are
// copied into the context, so the absent siblings are simply skipped. (Gradle 9 turned an
// `include` of a missing directory into a hard error, which otherwise breaks per-service images.)
['api-contracts',
 'platform-security',
 'platform-tenancy',
 'platform-outbox',
 'ledger-core-service',
 'party-service',
 'account-service',
 'transfer-service',
 'iam-service',
 'api-gateway'].each { module ->
    if (file(module).isDirectory()) {
        include module
    }
}
